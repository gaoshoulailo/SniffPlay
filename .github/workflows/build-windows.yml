name: Windows 自动构建

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  MPV_ARCHIVE: mpv-dev-x86_64-20260809-git-dd5d17d328.7z
  MPV_ARCHIVE_SHA256: c6aebf40bb722efe79090bfeb61e68625f0837770347e5a8b610aef78900cf12
  MPV_DLL_SHA256: 965efde4c8199f942bf9ed9d3e6fbcb7dd9dc961524d5780a9ca67da53f14d0c
  MPV_DOWNLOAD_URL: https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20260809-git-dd5d17d328.7z/download

jobs:
  build-windows:
    name: Windows x64 便携版
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 uv
        run: python -m pip install uv==0.12.5

      - name: 按锁文件安装依赖
        run: uv sync --locked --extra dev

      - name: 校验发布标签
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $projectVersion = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $expectedTag = "v$projectVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag must match pyproject.toml: expected $expectedTag, got $env:GITHUB_REF_NAME."
          }

      - name: 下载并校验 libmpv
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP $env:MPV_ARCHIVE
          $extractDirectory = Join-Path $env:RUNNER_TEMP "libmpv-extracted"

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --continue-at - `
            --connect-timeout 30 `
            --max-time 900 `
            --output $archivePath `
            $env:MPV_DOWNLOAD_URL
          if ($LASTEXITCODE -ne 0) {
            throw "libmpv download failed with exit code $LASTEXITCODE."
          }

          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:MPV_ARCHIVE_SHA256) {
            throw "libmpv archive checksum mismatch: $archiveHash"
          }

          New-Item -ItemType Directory -Force -Path $extractDirectory | Out-Null
          & 7z.exe x $archivePath "-o$extractDirectory" -y
          if ($LASTEXITCODE -ne 0) {
            throw "libmpv extraction failed with exit code $LASTEXITCODE."
          }

          $dll = Get-ChildItem -Recurse -File -LiteralPath $extractDirectory |
            Where-Object { $_.Name -in @("libmpv-2.dll", "mpv-2.dll") } |
            Select-Object -First 1
          if ($null -eq $dll) {
            throw "The verified archive does not contain libmpv-2.dll or mpv-2.dll."
          }

          $dllHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll.FullName).Hash.ToLowerInvariant()
          if ($dllHash -ne $env:MPV_DLL_SHA256) {
            throw "libmpv DLL checksum mismatch: $dllHash"
          }

          New-Item -ItemType Directory -Force -Path "vendor/mpv" | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination "vendor/mpv/libmpv-2.dll" -Force

      - name: 构建并执行启动烟雾测试
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: 补充 GPL 许可证文本
        shell: pwsh
        run: |
          $licensePath = "dist/SniffPlay/licenses/GPL-2.0.txt"
          Invoke-WebRequest `
            -Uri "https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt" `
            -OutFile $licensePath
          if ((Get-Item -LiteralPath $licensePath).Length -lt 10000) {
            throw "Downloaded GPL license text is incomplete."
          }

      - name: 生成 ZIP 和 SHA-256
        id: package
        shell: pwsh
        run: |
          $artifactDirectory = "artifacts"
          $zipName = "SniffPlay-Windows-x64.zip"
          $zipPath = Join-Path $artifactDirectory $zipName
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          Push-Location "dist"
          try {
            & 7z.exe a -tzip -mx=7 (Join-Path ".." $zipPath) "SniffPlay"
            if ($LASTEXITCODE -ne 0) {
              throw "ZIP creation failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$zipHash  $zipName" | Set-Content -Encoding ascii "$zipPath.sha256"
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "sha256=$zipHash" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SniffPlay-Windows-x64-${{ github.sha }}
          path: |
            artifacts/SniffPlay-Windows-x64.zip
            artifacts/SniffPlay-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 输出构建摘要
        shell: pwsh
        run: |
          @'
          ## Windows 构建完成

          - 文件：`SniffPlay-Windows-x64.zip`
          - SHA-256：`${{ steps.package.outputs.sha256 }}`
          - Artifact 保留：14 天
          - libmpv：固定 GPL-2.0-or-later 开发构建

          此 Artifact 用于构建验证。正式公开发布前仍需完成 libmpv 对应源码提供流程，或切换到经过验证的 LGPL 兼容构建。
          '@ >> $env:GITHUB_STEP_SUMMARY

  create-draft-release:
    name: 创建草稿 Release
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: 下载已验证的 Windows 构建
        uses: actions/download-artifact@v4
        with:
          name: SniffPlay-Windows-x64-${{ github.sha }}
          path: artifacts

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          name: SniffPlay ${{ github.ref_name }}
          body: |
            Windows x64 便携版已通过自动测试、打包和启动烟雾测试。

            发布前请确认项目许可证，并为当前 GPL-2.0-or-later libmpv 构建补齐对应源码提供材料；未完成前请勿公开此草稿。
          files: |
            artifacts/SniffPlay-Windows-x64.zip
            artifacts/SniffPlay-Windows-x64.zip.sha256
