name: Windows 自动构建

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  MPV_ARCHIVE: mpv-dev-lgpl-x86_64-20260827-git-182fa6ca49.7z
  MPV_ARCHIVE_SHA256: 16cd542f7386bf1e68339b90618fe5446171fa555daa0c6d07d59be43bb903ea
  MPV_DLL_SHA256: 63fed593a9e1b3c7e170bb38fcdf73722fa3d73b7c068f303bf2985eeec75367
  MPV_DOWNLOAD_URL: https://github.com/gaoshoulailo/SniffPlay/releases/download/libmpv-lgpl-20260827/mpv-dev-lgpl-x86_64-20260827-git-182fa6ca49.7z

jobs:
  build-windows:
    name: Windows x64 便携版
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 uv
        run: python -m pip install uv==0.12.5

      - name: 按锁文件安装依赖
        run: uv sync --locked --extra dev

      - name: 生成构建标识并校验发布标签
        id: metadata
        run: uv run python scripts/build_metadata.py

      - name: 下载并校验 libmpv
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP $env:MPV_ARCHIVE
          $extractDirectory = Join-Path $env:RUNNER_TEMP "libmpv-extracted"

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --continue-at - `
            --connect-timeout 30 `
            --max-time 900 `
            --output $archivePath `
            $env:MPV_DOWNLOAD_URL
          if ($LASTEXITCODE -ne 0) {
            throw "libmpv download failed with exit code $LASTEXITCODE."
          }

          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:MPV_ARCHIVE_SHA256) {
            throw "libmpv archive checksum mismatch: $archiveHash"
          }

          New-Item -ItemType Directory -Force -Path $extractDirectory | Out-Null
          & 7z.exe x $archivePath "-o$extractDirectory" -y
          if ($LASTEXITCODE -ne 0) {
            throw "libmpv extraction failed with exit code $LASTEXITCODE."
          }

          $dll = Get-ChildItem -Recurse -File -LiteralPath $extractDirectory |
            Where-Object { $_.Name -in @("libmpv-2.dll", "mpv-2.dll") } |
            Select-Object -First 1
          if ($null -eq $dll) {
            throw "The verified archive does not contain libmpv-2.dll or mpv-2.dll."
          }

          $dllHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll.FullName).Hash.ToLowerInvariant()
          if ($dllHash -ne $env:MPV_DLL_SHA256) {
            throw "libmpv DLL checksum mismatch: $dllHash"
          }

          New-Item -ItemType Directory -Force -Path "vendor/mpv" | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination "vendor/mpv/libmpv-2.dll" -Force

      - name: 构建并执行启动烟雾测试
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: 复制 libmpv 许可证文本
        shell: pwsh
        run: |
          $licenseFiles = @("LGPL-2.1.txt", "LGPL-3.0.txt")
          foreach ($licenseFile in $licenseFiles) {
            $sourcePath = Join-Path "vendor/mpv" $licenseFile
            $licensePath = Join-Path "dist/SniffPlay/licenses" $licenseFile
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Bundled libmpv license text is missing: $sourcePath"
            }
            if ((Get-Item -LiteralPath $sourcePath).Length -lt 5000) {
              throw "Bundled libmpv license text is incomplete: $sourcePath"
            }
            Copy-Item -LiteralPath $sourcePath -Destination $licensePath -Force
          }

      - name: 生成 ZIP 和 SHA-256
        id: package
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          $artifactDirectory = "artifacts"
          $zipName = $env:ZIP_NAME
          $zipPath = Join-Path $artifactDirectory $zipName
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          Copy-Item -LiteralPath "build-metadata/build-info.json" -Destination "dist/SniffPlay/build-info.json"
          Copy-Item -LiteralPath "build-metadata/build-info.json" -Destination "$artifactDirectory/build-info.json"

          Push-Location "dist"
          try {
            & 7z.exe a -tzip -mx=7 (Join-Path ".." $zipPath) "SniffPlay"
            if ($LASTEXITCODE -ne 0) {
              throw "ZIP creation failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$zipHash  $zipName" | Set-Content -Encoding ascii "$zipPath.sha256"
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "sha256=$zipHash" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 输出构建摘要
        shell: pwsh
        run: |
          @'
          ## Windows 构建完成

          - 文件：`${{ steps.metadata.outputs.zip_name }}`
          - 渠道：`${{ steps.metadata.outputs.channel }}`
          - 源码提交：`${{ github.sha }}`
          - SHA-256：`${{ steps.package.outputs.sha256 }}`
          - Artifact 保留：14 天
          - SniffPlay：GPL-3.0-or-later
          - libmpv：固定 LGPL 兼容构建（二进制按 LGPL-3.0-or-later）

          libmpv 构建来源、固定版本、依赖裁剪和校验值见 `licenses/libmpv-README.md`。
          '@ >> $env:GITHUB_STEP_SUMMARY

  publish-release:
    name: 发布预览版或正式版
    if: github.event_name == 'push' && (needs.build-windows.outputs.channel == 'preview' || needs.build-windows.outputs.channel == 'stable')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: 下载已验证的 Windows 构建
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build-windows.outputs.artifact_name }}
          path: artifacts

      - name: 发布已验证的构建
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-windows.outputs.release_tag }}
          CHANNEL: ${{ needs.build-windows.outputs.channel }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("artifacts/build-info.json").read_text(encoding="utf-8"))
          notes = [
              "Windows x64 便携版已通过自动测试、打包和启动烟雾测试。",
              "",
              f"- 渠道：{metadata['channel']}",
              f"- 项目版本：{metadata['version']}",
              f"- 源码提交：{metadata['commit']}",
              f"- 构建时间（UTC）：{metadata['built_at_utc']}",
              f"- 构建记录：{metadata['run_url']}",
              "",
              "SniffPlay：GPL-3.0-or-later。内置固定 libmpv 构建，来源及许可证随包提供。",
          ]
          if metadata["channel"] == "preview":
              notes.extend(["", "此为开发预览版，不代表稳定版本。"])
          Path("release-notes.md").write_text("\n".join(notes) + "\n", encoding="utf-8")
          PY
          if [[ "$CHANNEL" == "preview" ]]; then
            flags=(--prerelease --latest=false --target "$COMMIT_SHA")
            title="SniffPlay 预览版 $RELEASE_TAG"
          else
            flags=(--verify-tag --latest)
            title="SniffPlay $RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" \
            --title "$title" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            artifacts/*.zip artifacts/*.sha256 artifacts/build-info.json
