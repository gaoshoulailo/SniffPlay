name: 自动测试

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 uv
        run: python -m pip install uv==0.12.5

      - name: 按锁文件安装依赖
        run: uv sync --locked --extra dev

      - name: 运行单元测试
        run: uv run python -m pytest -q

      - name: 检查 Python 编译
        run: uv run python -m compileall -q src tests

      - name: 检查 QML
        shell: pwsh
        run: |
          $qmlFiles = @(
            "src/sniffplay_ui/Main.qml"
            "src/sniffplay_ui/components/AppButton.qml"
            "src/sniffplay_ui/components/ContextMenuItem.qml"
            "src/sniffplay_ui/components/NavButton.qml"
            "src/sniffplay_ui/components/PlayerBar.qml"
            "src/sniffplay_ui/pages/SearchPage.qml"
            "src/sniffplay_ui/pages/FavoritesPage.qml"
            "src/sniffplay_ui/pages/NowPlayingPage.qml"
            "src/sniffplay_ui/pages/PlaylistPage.qml"
            "src/sniffplay_ui/pages/HistoryPage.qml"
          )
          & ".venv/Scripts/pyside6-qmllint.exe" -I "src/sniffplay_ui" @qmlFiles
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
