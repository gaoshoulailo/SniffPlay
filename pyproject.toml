[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sniffplay"
version = "0.1.2"
description = "A lightweight, themeable desktop music search player."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "platformdirs>=4.3,<5",
    "python-mpv>=1.0.8,<2",
    "qasync>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.11,<7",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
sniffplay = "sniffplay.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sniffplay_ui = [
    "*.qml",
    "components/*.qml",
    "pages/*.qml",
    "themes/*.qml",
    "themes/qmldir",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
